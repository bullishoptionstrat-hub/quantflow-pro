services:
  - type: web
    name: quantflow-pro-backend
    runtime: node
    rootDir: backend
    region: ohio
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false  # set in Render dashboard
      # Fails closed to PRIVATE_RESEARCH when unset; an unrecognised value
      # throws at startup rather than being guessed. See provenance/rights.ts.
      - key: BUSINESS_MODE
        value: PRIVATE_RESEARCH
      # How many proxies sit in front of this service. Render puts exactly one
      # there, and the rate limiter reads the client address that many entries
      # from the RIGHT of `X-Forwarded-For` — the leftmost entry is whatever
      # the caller sent, and reading it let any caller mint a fresh bucket per
      # request. Raise this only if another proxy is added in front of Render.
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: TRADIER_TOKEN
        sync: false
      - key: POLYGON_API_KEY
        sync: false
      # ALPACA_KEY / ALPACA_SECRET were declared here and read by nothing —
      # there is no Alpaca connector in `backend/src`. Removed rather than
      # left as a slot an operator might fill.
      - key: FINNHUB_API_KEY
        sync: false

      # ── Free-tier connectors ────────────────────────────────────────────
      # Every one of these was read by `src/ingestion/connectors/*` and
      # declared nowhere, so a Blueprint deploy had no slot to put them in and
      # each source reported `disabled — no credentials` in production with no
      # way to fix it from the dashboard. `test/renderBlueprint.test.ts` now
      # fails if a new connector arrives without an entry here.
      #
      # YAHOO_ENABLED is deliberately absent. The rights gate refuses that
      # connector before `yahoo.ts` ever reads the variable, so declaring it
      # would advertise a switch that does nothing.
      - key: FRED_API_KEY            # free, unlimited: fred.stlouisfed.org/docs/api/api_key.html
        sync: false
      - key: FLASHALPHA_API_KEY
        sync: false
      - key: MARKETDATA_TOKEN
        sync: false
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: FMP_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: COINGECKO_API_KEY       # optional — the public endpoint works without it
        sync: false
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: REDDIT_USER_AGENT       # not a secret; defaults to QuantFlowPro/1.0
        sync: false
      - key: SCHWAB_APP_KEY
        sync: false
      - key: SCHWAB_APP_SECRET
        sync: false
      - key: SCHWAB_REFRESH_TOKEN
        sync: false
      - key: TASTYTRADE_USER
        sync: false
      - key: TASTYTRADE_PASS
        sync: false
      # Stooq is currently serving a browser-verification page rather than its
      # CSV; the connector reports that and caches nothing. Set to "false" to
      # stop it polling at all.
      - key: STOOQ_ENABLED
        sync: false

      # ── Web enrichment ──────────────────────────────────────────────────
      # Metered Firecrawl credits. Absent, enrichment reports `disabled` and
      # nothing else changes. See backend/src/enrichment.
      - key: FIRECRAWL_API_KEY
        sync: false

      # ── Demo mode ───────────────────────────────────────────────────────
      # Off unless set to exactly "1", and the frontend must set
      # NEXT_PUBLIC_DEMO_MODE=1 independently. Declared so the switch is
      # visible in the dashboard rather than folklore.
      - key: DEMO_MODE
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # UPSTASH_REDIS_REST_URL / _TOKEN were declared here and read by nothing.
      # `middleware/rateLimiter.ts` says "replace with Upstash Redis in
      # production" and there is no redis client in package.json — so the
      # rate limiter is in-memory whether or not these are set, and setting
      # them bought an operator nothing. They belong here again when something
      # reads them.


  # The `quantflow-pro-ml` service was declared here. It was never called by
  # anything, and its model was trained on data generated by `np.random` with a
  # fixed seed — `train.py` draws the label first and then samples features from
  # two hand-written distributions conditioned on it, so the classifier could
  # only ever recover the author's own branch. Scoring lives in
  # `backend/src/flow-engine/score.ts`, deterministic and with per-component
  # attribution on the wire.
